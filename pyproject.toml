[project]
name = "ds-seas5-skill"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.16.0",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "ocha-stratus>=0.1.3",
    "tqdm>=4.66.0",
    "geopandas>=0.14.0",
    "geodatasets>=2023.3.0",
    "plotly>=5.0.0",
    "anywidget>=0.11.0",
    "netcdf4>=1.7.4",
    "topojson>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
