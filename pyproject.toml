[project]
name = "ds-seas5-skill"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.16.0",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "ocha-stratus>=0.1.3",
    "tqdm>=4.66.0",
    "geopandas>=0.14.0",
    "geodatasets>=2023.3.0",
    "plotly>=5.0.0",
    "anywidget>=0.11.0",
    # vendored GEE drought-alert pipeline (gee_drought_alerts/) — see its VENDORED.md
    "earthengine-api>=1.0.0",       # ee — all GEE scripts
    "rasterio>=1.3.0",              # PSP raster build
    "requests>=2.31.0",            # ASAP scrape + Natural Earth basemap download
    "google-cloud-storage>=2.0.0",  # GCS staging for asset ingest
    "pyarrow>=15.0.0",             # parquet read/write (alert tables, backtest, sweep)
    "jupyter>=1.0.0",              # Quarto book execution (nbclient/nbformat/ipykernel)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
