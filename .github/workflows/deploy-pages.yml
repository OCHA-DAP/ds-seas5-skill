name: Deploy pages site to GitHub Pages

# Publishes the landing page (pages/) with the SEAS5 alerts app (docs/) assembled under /app/.
#
# Template: OCHA-DAP/ds-geospatial-impact-estimates (see also the manifest-driven variant in
# OCHA-DAP/ds-storm-impact-harmonisation PR #12 — deliberately not used here: two cards do not
# need a manifest). No build step, no Python environment, no credentials.
#
# Two triggers beyond push, and the second one is load-bearing:
#   - workflow_dispatch: manual redeploy.
#   - workflow_run on "Monthly data refresh": that workflow merges its data PR into main with
#     GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do NOT fire push-triggered workflows —
#     without this trigger the app's monthly data would silently stop reaching the site.
#
# This repo's Pages previously served main:/docs directly (legacy build). configure-pages with
# enablement: true switches the site to workflow builds on first run.
#
# The ENSO slides (~700 MB of per-country SVGs/PDFs) are NOT in git: they live on the
# dev projects blob (see pipeline/sync_enso_slides.py) and are downloaded into the
# artifact here — the KB's "Pages artifact storage" modality with blob as the durable
# store. Re-rendering locally + `sync_enso_slides.py upload` + a dispatch of this
# workflow publishes a new bundle.

on:
  push:
    branches: [main]
    paths: ["pages/**", "docs/**", ".github/workflows/deploy-pages.yml"]
  workflow_run:
    workflows: ["Monthly data refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # For workflow_run, deploy only after a successful refresh (a failed refresh leaves main
    # unchanged, so there is nothing new to publish).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download ENSO slides from blob
        env:
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          pip install --quiet ocha-stratus
          python pipeline/sync_enso_slides.py download
      - name: Assemble site (landing at /, app at /app/)
        run: |
          mkdir -p site
          rsync -a pages/ site/
          rsync -a docs/ site/app/
          test -f site/index.html && test -f site/app/index.html && test -f site/uganda/index.html
          test -f site/enso/index.html && test -f site/enso/countries.json
          test -f site/enso/slides/NER_slide1.svg && test -f site/enso/slides/NER_fr.pdf
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
