# Temporary — verifies github-actions[bot] can push to main past the org ruleset.
name: Test bot push to main (temporary)

on:
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push empty commit as github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "ci: verify refresh bot can push to main [skip ci]"
          git push
