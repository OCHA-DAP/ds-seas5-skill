name: Monthly data refresh

on:
  schedule:
    - cron: "0 3 7 * *"  # 03:00 UTC on the 7th of every month (buffer after ~5th SEAS5 issuance)
  workflow_dispatch:
    inputs:
      test_push:
        description: "Only test that the bot can push to main (skips the pipeline)"
        type: boolean
        default: false

# NOTE: compute_skill_raster.py (pixel-level forecast layer) is intentionally
# excluded — it is memory/time-heavy and not suited for a standard 7 GB runner.
# Refresh the raster layer manually when needed.

jobs:
  # Dispatch-only push check: verifies github-actions[bot] can push to main (the same
  # push the refresh job ends with) without running the 40-minute pipeline.
  test-push:
    if: ${{ inputs.test_push }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push empty commit as github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "ci: verify refresh bot can push to main [skip ci]"
          git push

  refresh:
    if: ${{ !inputs.test_push }}
    runs-on: ubuntu-latest
    # Runtime: compute_skill.py takes ~30 min for all ~152 countries.
    # NOTE: The PROD Azure DB firewall must allow GitHub Actions egress IPs.
    permissions:
      contents: write
      pull-requests: write

    env:
      DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
      DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
      # adm3 export reads the adm3 shapefiles from the PROD polygon container
      DSCI_AZ_BLOB_PROD_SAS: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS }}
      DSCI_AZ_DB_PROD_PW: ${{ secrets.DSCI_AZ_DB_PROD_PW }}
      DSCI_AZ_DB_PROD_HOST: ${{ secrets.DSCI_AZ_DB_PROD_HOST }}
      DSCI_AZ_DB_PROD_UID: ${{ secrets.DSCI_AZ_DB_PROD_UID }}
      # The Forecast × HNRP export reads the dev DB (hpc/ipc/pop schemas from the
      # hnrp/ipc/population mirrors).
      DSCI_AZ_DB_DEV_PW: ${{ secrets.DSCI_AZ_DB_DEV_PW }}
      DSCI_AZ_DB_DEV_HOST: ${{ secrets.DSCI_AZ_DB_DEV_HOST }}
      DSCI_AZ_DB_DEV_UID: ${{ secrets.DSCI_AZ_DB_DEV_UID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Recompute skill stats from SEAS5 DB → dev blob
        run: uv run python pipeline/compute_skill.py

      - name: Export static site data (forecast.json, skill_matrix.json, countries.geojson)
        run: uv run python pipeline/export_static_site.py

      - name: Export history browser data (forecasts/YYYY-MM.json + index.json)
        run: uv run python pipeline/export_history_site.py

      # Needs the ADM1 skill stats (compute_skill_adm1.py output in the dev blob);
      # those are refreshed manually after each issuance for now. Geometry rebuild
      # is skipped when docs/data/hnrp_adm1.geojson exists (it is committed).
      - name: Export Forecast × HNRP tab data (hnrp_drought.json)
        run: uv run python pipeline/export_hnrp_drought.py

      # Same manual-prerequisite caveat: compute_skill_adm2.py after each issuance.
      - name: Export Forecast × HNRP admin-2 data (hnrp_drought_adm2.json)
        run: uv run python pipeline/export_hnrp_drought.py --level 2

      - name: Export Forecast × HNRP admin-3 data (forecast from parent adm2)
        run: uv run python pipeline/export_hnrp_drought.py --level 3

      - name: Combine per-country lowest-level view (hnrp_drought_low.json)
        run: uv run python pipeline/export_hnrp_drought.py --level low

      # Country-level plan headline caseloads straight from the public HPC API —
      # the admin-level mirror lags the plan cycle, this does not.
      - name: Export plan headline caseloads (plan_caseloads.json)
        run: uv run python pipeline/export_plan_caseloads.py

      # Vintage gate: every payload must show the issuance it claims (in-season
      # trimesters present, exporters numerically consistent, raster honest).
      # Fails the run BEFORE anything is committed — a refresh that raced the
      # ERA5 upload must be rerun later, not shipped without in-season data.
      - name: Verify payload vintages & consistency
        run: uv run python pipeline/verify_site_data.py

      # main is branch-protected (PRs required, 0 approvals) — a direct push is
      # rejected, so the refresh lands via a self-merged PR instead.
      - name: Commit updated data via PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          BR="data-refresh-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BR"
          git commit -m "chore: monthly data refresh [skip ci]"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" --fill
          gh pr merge "$BR" --merge --delete-branch
