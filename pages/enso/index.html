<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENSO &amp; the seasonal forecast, by country</title>
<meta name="description" content="For every country in the SEAS5 alerts app: what generally happens during El Niño (pixelwise ERA5 teleconnection) and what the current SEAS5 issuance predicts, with PDF downloads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/DejaVuSans.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/DejaVuSans-Bold.woff" as="font" type="font/woff" crossorigin>
<style>
  :root { color-scheme: light; }
  /* the exact faces matplotlib laid the slides out with, subsetted */
  @font-face { font-family: "DejaVu Sans"; font-weight: 400; font-display: swap;
    src: url("fonts/DejaVuSans.woff") format("woff"); }
  @font-face { font-family: "DejaVu Sans"; font-weight: 700; font-display: swap;
    src: url("fonts/DejaVuSans-Bold.woff") format("woff"); }
  body { margin: 0; background: #f5f6f7; color: #1a1a1a;
         font: 400 15px/1.55 'Roboto', system-ui, sans-serif; }
  .home-link { display: inline-block; margin: 10px 12px; padding: 6px 12px;
    font: 500 13px/1 'Roboto', system-ui, sans-serif; color: #1e795f;
    background: #e9f5f1; border: 1px solid #d4eae4; border-radius: 4px;
    text-decoration: none; }
  .home-link:hover { background: #d4eae4; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
               margin: 8px 0 6px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0; }
  select { font: 500 15px 'Roboto', system-ui, sans-serif; padding: 7px 10px;
           border: 1px solid #c9ced3; border-radius: 4px; background: #fff;
           color: #1a1a1a; max-width: 340px; }
  .pdf { display: inline-block; padding: 8px 14px; border-radius: 4px;
         background: #1e795f; color: #fff; font-weight: 500; font-size: 14px;
         text-decoration: none; }
  .pdf:hover { background: #16604b; }
  .lang { margin-left: auto; display: flex; gap: 4px; }
  .lang button { font: 600 12.5px 'Roboto', system-ui, sans-serif; padding: 6px 10px;
    border: 1px solid #c9ced3; background: #fff; color: #555; border-radius: 4px;
    cursor: pointer; }
  .lang button[aria-pressed="true"] { background: #1e795f; border-color: #1e795f;
    color: #fff; }
  .sub { color: #555; margin: 2px 0 18px; max-width: 78ch; }
  h2 { font-size: 18px; font-weight: 700; margin: 22px 0 8px; }
  figure { margin: 0 0 8px; background: #fff; border: 1px solid #e2e4e6;
           border-radius: 6px; padding: 10px; }
  figure img { display: block; width: 100%; height: auto; border-radius: 3px; }
  .slidebox svg { display: block; width: 100%; height: auto; border-radius: 3px; }
  .slidebox { min-height: 120px; position: relative; }
  .slidebox.loading::after { content: attr(data-loading);
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #98a0a8; font-size: 14px; }
  .issued { color: #777; font-size: 13px; margin: -12px 0 16px; }
  figcaption { color: #666; font-size: 13px; padding: 10px 6px 2px; max-width: 110ch; }
  .meta { color: #777; font-size: 13px; border-top: 1px solid #e2e4e6;
          padding-top: 14px; margin-top: 24px; }
  .meta code { background: #eceeef; padding: 1px 5px; border-radius: 3px;
               font-size: 12px; }
</style>
</head>
<body>
<!-- back to the site landing page — first element inside body -->
<a class="home-link" id="home" href="../">← SEAS5 Precipitation Alerts</a>

<div class="wrap">
  <header class="top">
    <h1 id="h1">ENSO &amp; the seasonal forecast</h1>
    <select id="country" aria-label="Country"></select>
    <a class="pdf" id="pdf" href="#" download>Download PDF</a>
    <span class="lang" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-fr" aria-pressed="false">FR</button>
    </span>
  </header>
  <p class="sub" id="sub"></p>
  <p class="issued" id="issued"></p>

  <h2 id="h2a"></h2>
  <figure>
    <div id="slide1" class="slidebox" role="img" aria-label="Pixelwise partial correlation of ERA5 rainfall with the Niño3.4 index over the selected country: brown areas tend to be drier than normal in El Niño years, blue areas wetter, by season."></div>
    <figcaption id="cap1"></figcaption>
  </figure>

  <h2 id="h2b"></h2>
  <figure>
    <div id="slide2" class="slidebox" role="img" aria-label="The current SEAS5 seasonal forecast for the selected country: drought and flood return-period categories with skill shading for every valid trimester of the latest issuance, with ADM1 boundaries and a country-mean rainfall bar chart."></div>
    <figcaption id="cap2"></figcaption>
  </figure>

  <p class="meta" id="meta"></p>
</div>

<script>
(async function () {
  const STR = {
    en: {
      home: "← SEAS5 Precipitation Alerts",
      h1: "ENSO & the seasonal forecast",
      sub: `Two slides for every country in the <a href="../app/">SEAS5 alerts app</a>:
        the historical El Niño rainfall signal, and what the current forecast says.
        Pick a country — the link in your address bar updates, so it can be shared
        directly.`,
      h2a: "1 · What generally happens during El Niño",
      h2b: "2 · What's predicted this year — El Niño and all other factors included",
      cap1: `Pixelwise partial correlation of rainfall (ERA5 0.25°, 1981–2025) with
        Niño3.4, holding the other climate modes (IOD, TNA, TSA, AMM) constant —
        ENSO's unique signal, per the
        <a href="https://ocha-dap.github.io/ds-teleconnections/">ERA5 teleconnections</a>
        methodology. Brown = El Niño years tend drier; blue = wetter.`,
      cap2: `The latest SEAS5 issuance (which integrates El Niño alongside every other
        driver), for all its valid trimesters, in the <a href="../app/">alerts
        app's</a> categories: drought/flood 3-yr and 10-yr return periods, shaded by
        forecast skill, over ADM1. Country-level return periods and percentiles are
        the app's own numbers.`,
      pdf: "Download PDF",
      meta: `Generated by <code>analysis/png_enso_slides.py</code> from ERA5, NOAA PSL
        climate indices, and the seas5-skill detrended skill cube + country-level
        export (see the app's methodology tab). Slides refresh with the app's monthly
        issuance when the script is rerun.`,
      countryLabel: "Country",
      titleSuffix: "ENSO & the seasonal forecast",
      pageTitle: "ENSO & the seasonal forecast, by country",
      issued: (d) => `Current forecast issued ${d}. Slides refresh with the app's monthly issuance.`,
      loading: "Loading…",
    },
    fr: {
      home: "← Alertes précipitations SEAS5",
      h1: "ENSO et la prévision saisonnière",
      sub: `Deux diapositives pour chaque pays de
        <a href="../app/">l'application d'alertes SEAS5</a> : le signal pluviométrique
        historique d'El Niño, et ce que dit la prévision actuelle. Choisissez un pays —
        le lien dans la barre d'adresse se met à jour et peut être partagé directement.`,
      h2a: "1 · Ce qui se passe généralement pendant El Niño",
      h2b: "2 · Ce qui est prévu cette année — El Niño et tous les autres facteurs pris en compte",
      cap1: `Corrélation partielle pixel par pixel des précipitations (ERA5 0,25°,
        1981–2025) avec Niño3.4, les autres modes climatiques (IOD, TNA, TSA, AMM)
        étant maintenus constants — le signal propre à l'ENSO, selon la méthodologie des
        <a href="https://ocha-dap.github.io/ds-teleconnections/">téléconnexions ERA5</a>.
        Brun = les années El Niño tendent à être plus sèches ; bleu = plus humides.`,
      cap2: `La dernière prévision SEAS5 (qui intègre El Niño parmi tous les autres
        facteurs), pour tous ses trimestres valides, dans les catégories de
        <a href="../app/">l'application d'alertes</a> : périodes de retour de 3 et
        10 ans (sécheresse/inondation), avec ombrage selon l'exactitude de la
        prévision, sur les limites ADM1. Les périodes de retour et percentiles
        nationaux sont les chiffres de l'application elle-même.`,
      pdf: "Télécharger le PDF",
      meta: `Généré par <code>analysis/png_enso_slides.py</code> à partir d'ERA5, des
        indices climatiques de la NOAA PSL, et du cube d'exactitude de la prévision +
        de l'export national de seas5-skill (voir l'onglet méthodologie de
        l'application). Les diapositives sont actualisées avec l'émission mensuelle de
        l'application lorsque le script est relancé.`,
      countryLabel: "Pays",
      titleSuffix: "ENSO et la prévision saisonnière",
      pageTitle: "ENSO et la prévision saisonnière, par pays",
      issued: (d) => `Prévision actuelle émise en ${d}. Les diapositives suivent l'émission mensuelle de l'application.`,
      loading: "Chargement…",
    },
  };

  const $ = (id) => document.getElementById(id);
  const sel = $("country");
  let lang = "en";
  let current = null;

  const manifest = await (await fetch("countries.json")).json();
  const countries = manifest.countries || manifest;
  for (const c of countries) {
    const o = document.createElement("option");
    o.value = c.iso3;
    o.textContent = c.name;
    sel.appendChild(o);
  }
  const valid = new Set(countries.map((c) => c.iso3));

  function applyLang() {
    const t = STR[lang];
    document.documentElement.lang = lang;
    $("home").textContent = t.home;
    $("h1").innerHTML = t.h1.replace("&", "&amp;");
    $("sub").innerHTML = t.sub;
    $("h2a").textContent = t.h2a;
    $("h2b").textContent = t.h2b;
    $("cap1").innerHTML = t.cap1;
    $("cap2").innerHTML = t.cap2;
    $("pdf").textContent = t.pdf;
    $("meta").innerHTML = t.meta;
    const iss = manifest.issued;
    $("issued").textContent = iss ? t.issued(iss[lang] || iss.en) : "";
    sel.setAttribute("aria-label", t.countryLabel);
    $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    $("lang-fr").setAttribute("aria-pressed", String(lang === "fr"));
    const name = countries.find((c) => c.iso3 === current)?.name;
    document.title = name ? `${name} — ${t.titleSuffix}` : t.pageTitle;
  }

  function syncUrl() {
    const q = new URLSearchParams();
    if (current) q.set("country", current);
    if (lang !== "en") q.set("lang", lang);
    history.replaceState(null, "", `${location.pathname}?${q.toString()}`);
  }

  // SVGs are INLINED (not <img>) so the slide text is selectable like normal
  // HTML. A generation token guards against out-of-order fetches on fast
  // country/language switching.
  let gen = 0;
  async function inline(el, url) {
    const g = String(++gen);
    el.dataset.gen = g;
    el.dataset.loading = STR[lang].loading;
    el.classList.add("loading");
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(String(r.status));
      const svg = await r.text();
      if (el.dataset.gen === g) el.innerHTML = svg;
    } catch {
      if (el.dataset.gen === g) el.innerHTML = "";
    } finally {
      if (el.dataset.gen === g) el.classList.remove("loading");
    }
  }
  function show(iso3) {
    current = iso3;
    sel.value = iso3;
    const sfx = lang === "fr" ? "_fr" : "";
    inline($("slide1"), `slides/${iso3}_slide1${sfx}.svg`);
    inline($("slide2"), `slides/${iso3}_slide2${sfx}.svg`);
    $("pdf").href = `slides/${iso3}${sfx}.pdf`;
    $("pdf").setAttribute("download", `enso_${iso3}${sfx}.pdf`);
    applyLang();
  }

  sel.addEventListener("change", () => { show(sel.value); syncUrl(); });
  $("lang-en").addEventListener("click", () => { lang = "en"; show(current); syncUrl(); });
  $("lang-fr").addEventListener("click", () => { lang = "fr"; show(current); syncUrl(); });

  const params = new URLSearchParams(location.search);
  if ((params.get("lang") || "").toLowerCase() === "fr") lang = "fr";
  const fromUrl = (params.get("country") || "").toUpperCase();
  show(valid.has(fromUrl) ? fromUrl : (valid.has("AFG") ? "AFG" : countries[0].iso3));
  if (fromUrl || lang !== "en") syncUrl();
})();
</script>
</body>
</html>
