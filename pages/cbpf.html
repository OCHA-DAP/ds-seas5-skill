<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved — CBPF view</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="app/cbpf.html">
<!--
  This page used to live at /cbpf.html. The Pages restructure (landing at /, app
  assembled from docs/ into /app/) moved it to /app/cbpf.html and left every
  shared link to the old path returning a 404. Same thin-stub pattern as
  /cma/index.html: reach the people holding the old link, offer nothing to
  indexers or passers-by.

  The JS hop preserves ?query and #hash so a deep link survives; the meta
  refresh covers JS being off, and the visible link covers both being off.
-->
<meta http-equiv="refresh" content="2; url=app/cbpf.html">
<script>
  // Same-document redirect, keeping whatever the old link carried after the path.
  // replace(), not assign(): the stub should not sit in the back button between
  // the reader and the page they asked for.
  location.replace("app/cbpf.html" + location.search + location.hash);
</script>
</head>
<body style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
             margin:60px auto;max-width:34rem;padding:0 20px;line-height:1.6;color:#1f2324">
  <h1 style="font-size:19px;margin:0 0 10px">This page has moved</h1>
  <p style="margin:0 0 16px;color:#3f4748">It now lives one level deeper, under
     <code>/app/</code>. You should be sent there automatically.</p>
  <p style="margin:0"><a href="app/cbpf.html">Continue to the page</a></p>
</body>
</html>
